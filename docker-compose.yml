services:
  url-shortener:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_PATH: /app/data/url-shortener.db
      PUBLIC_BASE_URL: http://localhost:8000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-before-production}
      ANALYTICS_SALT: ${ANALYTICS_SALT:-change-me-before-production}
    volumes:
      - url-data:/app/data

volumes:
  url-data:

